<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Job Watch</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔭</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F1F3EE; --ink: #1D2622; --muted: #5E6B64; --line: #D5DBD3;
    --accent: #1E5F74; --fresh: #D99414; --field: #FFFFFF;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #151B19; --ink: #E4E9E4; --muted: #99A69F; --line: #2C3632;
      --accent: #7CC3D6; --fresh: #F0B444; --field: #1C2421;
    }
  }
  :root[data-theme="dark"] {
    --paper: #151B19; --ink: #E4E9E4; --muted: #99A69F; --line: #2C3632;
    --accent: #7CC3D6; --fresh: #F0B444; --field: #1C2421;
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font: 400 16px/1.55 "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .wrap { max-width: 860px; margin: 0 auto; padding: 3rem 1.25rem 4rem; }

  header h1 {
    font: 700 clamp(2.4rem, 7vw, 4rem)/1 "Bricolage Grotesque", "Public Sans", sans-serif;
    letter-spacing: -0.03em; margin: 0 0 .75rem;
  }
  .summary { color: var(--muted); margin: 0 0 2rem; max-width: 60ch; }
  .summary strong { color: var(--ink); font-weight: 600; }

  .controls {
    display: grid; grid-template-columns: minmax(10rem, 1fr) minmax(0, 15rem) auto auto; gap: .6rem;
    align-items: center;
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 2;
    background: var(--paper); padding: .75rem 0; border-bottom: 1px solid var(--line);
  }
  select { text-overflow: ellipsis; max-width: 100%; }
  input, select {
    font: inherit; color: var(--ink); background: var(--field);
    border: 1px solid var(--line); border-radius: 8px; padding: .55rem .75rem; min-width: 0;
  }
  input:focus-visible, select:focus-visible, a:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }

  .day { margin-top: 2.25rem; }
  .day h2 {
    font: 500 1.05rem/1.2 "Bricolage Grotesque", "Public Sans", sans-serif;
    color: var(--muted); margin: 0 0 .25rem; display: flex; gap: .6rem; align-items: baseline;
  }
  .day h2 .count { font-size: .85rem; }

  .job {
    display: grid; grid-template-columns: 11rem 1fr; gap: 1.25rem;
    padding: 1.1rem 0; border-top: 1px solid var(--line);
  }
  .company { font-weight: 600; font-size: .95rem; padding-top: .15rem; overflow-wrap: anywhere; }
  .title {
    font: 700 1.3rem/1.25 "Bricolage Grotesque", "Public Sans", sans-serif;
    color: var(--ink); text-decoration: none; letter-spacing: -0.01em;
  }
  .title:hover { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }
  .job.is-fresh .title::before {
    content: ""; display: inline-block; width: .55rem; height: .55rem; border-radius: 50%;
    background: var(--fresh); margin-right: .5rem; vertical-align: .15em;
  }
  .loc { color: var(--muted); font-size: .92rem; margin-top: .2rem; }
  .when { color: var(--muted); font-size: .85rem; white-space: nowrap; }
  .company-sub { color: var(--muted); font-size: .85rem; display: block; margin-top: .15rem; font-weight: 400; }
  .desc { margin: .5rem 0 .4rem; max-width: 68ch; }
  .open { color: var(--accent); font-weight: 600; font-size: .92rem; }

  .empty { padding: 3rem 0; color: var(--muted); max-width: 55ch; }
  .empty strong { color: var(--ink); display: block; font-size: 1.1rem; margin-bottom: .35rem; }

  footer { margin-top: 3.5rem; padding-top: 1.25rem; border-top: 1px solid var(--line);
           color: var(--muted); font-size: .9rem; }
  footer ul { margin: .4rem 0 1rem; padding-left: 1.1rem; }
  footer p { margin: 0 0 .5rem; }
  footer summary { cursor: pointer; color: var(--accent); font-weight: 600; }
  .bad { color: #B3412E; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .bad { color: #F08A73; } }

  @media (max-width: 640px) {
    .wrap { padding-top: 2rem; }
    .controls { grid-template-columns: 1fr 1fr 1fr; }
    .controls select { font-size: .9rem; padding: .5rem; }
    .controls input { grid-column: 1 / -1; }
    .job { grid-template-columns: 1fr; gap: .25rem; }
    .company { color: var(--muted); font-size: .88rem; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Job Watch</h1>
    <p class="summary" id="summary"></p>
  </header>

  <div class="controls" role="search">
    <input id="q" type="search" placeholder="Search titles, companies, locations" aria-label="Search jobs">
    <select id="company" aria-label="Company"><option value="">All companies</option></select>
    <select id="range" aria-label="Time range">
      <option value="0" selected>All time</option>
      <option value="1">Last 24 hours</option>
      <option value="7">Last 7 days</option>
      <option value="30">Last 30 days</option>
    </select>
    <select id="sort" aria-label="Sort">
      <option value="new" selected>Newest first</option>
      <option value="old">Oldest first</option>
      <option value="company">Company A–Z</option>
    </select>
  </div>

  <main id="list"></main>
  <footer id="foot"></footer>
</div>

function ago(iso) {
  const mins = Math.round((Date.now() - new Date(iso)) / 60000);
  if (mins < 1) return "just now";
  if (mins < 60) return `${mins} min ago`;
  const h = Math.round(mins / 60);
  if (h < 24) return `${h} hour${h === 1 ? "" : "s"} ago`;
  const d = Math.round(h / 24);
  return `${d} day${d === 1 ? "" : "s"} ago`;

  if (key(d) === key(y)) return "Yesterday";

    }
    let out = "";
    for (const [label, list] of groups) {
      out += `<section class="day"><h2>${esc(label)} <span class="count">${list.length} ${sort === "company" ? (list.length === 1 ? "posting" : "postings") : "new"}</span></h2>`;
      for (const j of list) {
        const fresh = Date.now() - new Date(j.found) < 864e5;
        out += `<article class="job${fresh ? " is-fresh" : ""}">
          <div class="company">${esc(j.company)}</div>
          <div>
            <a class="title" href="${esc(j.url)}" target="_blank" rel="noopener">${esc(j.title)}</a>
            <div class="loc">${j.location ? esc(j.location) + " &nbsp; " : ""}<span class="when">Posted ${esc(ago(j.found))}</span></div>
            ${j.description ? `<p class="desc">${esc(j.description)}</p>` : ""}
            <a class="open" href="${esc(j.url)}" target="_blank" rel="noopener">View on ${esc(j.company)}'s site</a>
          </div>
        </article>`;
      }
      out += `</section>`;
    }
    $("list").innerHTML = out;
  }

  const st = DATA.status || {};
  const names = Object.keys(st);
  const bad = names.filter(n => st[n] !== "ok");
  $("foot").innerHTML = names.length
    ? (bad.length
        ? `<p class="bad">${bad.length} of ${names.length} sites couldn't be checked on the last run:</p><ul>${bad.map(n => `<li>${esc(n)}: ${esc(st[n])}</li>`).join("")}</ul>`
        : `<p>All ${names.length} sites were checked successfully on the last run.</p>`) +
      `<details><summary>Sites you're watching</summary><p>${names.map(esc).join(", ")}</p></details>`
    : "Add companies in companies.yaml to start watching.";
}

["q", "company", "range", "sort"].forEach(id => $(id).addEventListener("input", render));
render();
</script>
</body>
</html>
