# ---------------------------------------------------------------
# Job Watch: companies and job boards to check every 30 minutes.
#
# Entries without a "name" get named automatically from the page's
# own title on the first run. Add a name line to override it.
#
# Types: greenhouse, lever, ashby, smartrecruiters, workday, ukg,
# dayforce, adp, bamboohr, hireology, isolved, icims, paycom,
# teamwork (TeamWork Online), page (any other careers page).
# ---------------------------------------------------------------

