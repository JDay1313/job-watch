    every_minutes: 120

  # ----- Not monitored -----
  # Indeed (Daiwa) blocks automated checks outright; Daiwa's own careers page is watched above.

# Global filters. Leave a list empty to allow everything.
# Matching is case-insensitive and looks for the words anywhere.
filters:
  keywords: []          # job title must contain at least one, e.g. [analyst, analytics, data]
  exclude: []           # skip titles containing any, e.g. [cook, custodian, security]
  locations: []         # location must contain at least one, e.g. [remote, CA]
