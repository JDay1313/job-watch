  # ----- Paycor boards -----
  # Paycor's robots.txt asks automated tools not to visit. You chose to check
  # these anyway, so they're set to ignore that request and are checked
  # gently: every 2 hours instead of every 30 minutes.
  - type: paycor
    url: https://recruitingbypaycor.com/career/CareerHome.action?clientId=8a7883d07c5da337017c9998a2cb1623
    ignore_robots: true
    every_minutes: 120

  - type: paycor
