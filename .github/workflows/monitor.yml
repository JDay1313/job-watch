name: Check for new jobs

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: job-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Find the Job Watch files
        run: |
          FOUND=$(find . -name monitor.py -not -path "./.git/*" | head -1)
          if [ -z "$FOUND" ]; then
            echo "::error::monitor.py isn't in this repository. Upload the Job Watch files first."
            exit 1
          fi
          echo "JW_DIR=$(dirname "$FOUND")" >> "$GITHUB_ENV"
          echo "Job Watch files are in: $(dirname "$FOUND")"
      - run: pip install -r "$JW_DIR/requirements.txt"
      - name: Check career sites
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
        run: cd "$JW_DIR" && python monitor.py
      - name: Publish the board
        run: |
          # GitHub Pages reads the top-level docs folder, so copy the board there
          if [ "$JW_DIR" != "." ]; then
            mkdir -p docs
            cp -r "$JW_DIR/docs/." docs/
          fi
          touch docs/.nojekyll
      - name: Save results
        run: |
          git config user.name "job-watch-bot"
          git config user.email "job-watch-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Job check $(date -u +'%Y-%m-%d %H:%M')"
          git push
